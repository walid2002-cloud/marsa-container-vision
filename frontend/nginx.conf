server {
    listen 80;
    server_name localhost;
    root /usr/share/nginx/html;
    index index.html;

    resolver 127.0.0.11 valid=10s ipv6=off;
    set $backend_upstream backend:5081;
    set $ai_upstream ai-service:8001;

    # Photos conteneur (évite 413 Request Entity Too Large — défaut nginx 1m)
    client_max_body_size 40m;

    # Toutes les routes React sont redirigées vers index.html
    location / {
        try_files $uri $uri/ /index.html;
        location = /index.html {
            add_header Cache-Control "no-store, no-cache, must-revalidate";
        }
    }

    # /ai/results/x.png → service IA /results/x.png (proxy_pass avec variable ne strip pas le préfixe)
    location /ai/ {
        rewrite ^/ai/(.*)$ /$1 break;
        proxy_pass http://$ai_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header Accept $http_accept;
        client_max_body_size 40m;
        add_header Cache-Control "public, max-age=300";
        add_header X-Content-Type-Options "nosniff";
        proxy_intercept_errors on;
        error_page 404 = @ai_asset_missing;
    }

    location @ai_asset_missing {
        default_type text/plain;
        return 404 'AI asset not found';
    }

    # WebSocket (Socket.IO) backend
    location /socket.io/ {
        proxy_pass http://$backend_upstream;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_read_timeout 86400;
    }

    # Proxy vers le backend API
    location /api/ {
        proxy_pass http://$backend_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        client_max_body_size 40m;
        proxy_read_timeout 300s;
        proxy_connect_timeout 60s;
        proxy_send_timeout 300s;
    }
}
